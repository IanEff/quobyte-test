# MinIO warp against the S3 gateway: a mixed GET/PUT/STAT/DELETE run.
# Not part of the kustomization. `task play:bench` (re)creates it, since it's
# bursty and loud: watch it land in Hubble (L7 on :8484) and in Grafana.
apiVersion: batch/v1
kind: Job
metadata:
  name: warp-mixed
  namespace: quobyte-play
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: warp }
    spec:
      restartPolicy: Never
      containers:
        - name: warp
          image: minio/warp:v1.3.1
          args:
            - mixed
            - --host=s3.quobyte-test.lab:80
            - --access-key=$(AWS_ACCESS_KEY_ID)
            - --secret-key=$(AWS_SECRET_ACCESS_KEY)
            - --bucket=warp-bench
            - --duration=3m
            - --concurrent=4
            - --objects=200
            - --obj.size=256KiB
          envFrom:
            - secretRef: { name: s3-credentials }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { memory: 1Gi }
