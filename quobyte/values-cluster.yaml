quobyte:
  storageProvisioner: pd.csi.storage.gke.io
  flashStorage: pd-standard

  replicas:
    registry: 3
    data: 3
    metadata: 3
    api: 2
    webconsole: 1
    s3: 1

  datadisks:
    - name: data0
      mountpoint: /var/lib/quobyte/devices/data0
      size: "30Gi"
  metadatadisks:
    - name: metadata0
      mountpoint: /var/lib/quobyte/devices/metadata0
      size: "30Gi"

  s3:
    enabled: true
    replicas: 1
    dnsname: s3.quobyte-test.lab

  lbinternal: false
  webconsoleport: 8080
  # :4 and :4.9 both resolved to this digest (verified 2026-09-22, skopeo
  # inspect) — pinned by digest, not the floating :4 tag, so an upgrade never
  # silently jumps point releases on a pod restart/reschedule.
  image: quay.io/quobyte/quobyte-server@sha256:6a3dd968f6c48eaa8050eaa42751675e6d406508f8ea9cf72b2a77bf0da440ef
  maxopenfiles: "1048576"
  maxprocs: "16384"

hostNetwork: false
