quobyte:
  storageProvisioner: pd.csi.storage.gke.io
  flashStorage: pd-standard

  replicas:
    registry: 3
    data: 3
    metadata: 3
    api: 2
    webconsole: 1
    s3: 1

  datadisks:
    - name: data0
      mountpoint: /var/lib/quobyte/devices/data0
      size: "30Gi"
  metadatadisks:
    - name: metadata0
      mountpoint: /var/lib/quobyte/devices/metadata0
      size: "30Gi"

  # Quobyte 5.1's S3 gateway defaults to a 10 GiB object cache and refuses to
  # start when that exceeds what the node's RAM allows (~7.7 GiB on an 8 GB
  # e2-standard-2). Chart 0.3.0 has no knob for it and QUOBYTE_MAX_BUFFER_S3
  # doesn't move it, so the workers are e2-highmem-2 (16 GB) instead.
  s3:
    enabled: true
    replicas: 1
    dnsname: s3.quobyte-test.lab

  lbinternal: false
  webconsoleport: 8080
  # :5 and :5.1 both resolved to this digest (verified 2026-09-22, skopeo
  # inspect --raw | sha256) — pinned by digest, not the floating :5 tag, so an
  # upgrade never silently jumps point releases on a pod restart/reschedule.
  # 5.x is required for the API service's /mcp endpoint (4.9 has no MCP
  # server; 5.1 ships mcp-core-2.0.0.jar). Previous pin, 4.9:
  # sha256:6a3dd968f6c48eaa8050eaa42751675e6d406508f8ea9cf72b2a77bf0da440ef
  image: quay.io/quobyte/quobyte-server@sha256:88fd2e5642529a8fb324f8bc22e127e1f3b5ddce77f9446ae9a7c9de53bbf652
  maxopenfiles: "1048576"
  maxprocs: "16384"

hostNetwork: false
