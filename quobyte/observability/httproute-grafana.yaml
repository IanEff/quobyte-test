apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: cilium-gateway
      namespace: kube-system
  hostnames:
    - "grafana.quobyte-test.lab"
  rules:
    - backendRefs:
        - name: grafana
          port: 80
