kubeProxyReplacement: true
routingMode: tunnel
tunnelProtocol: vxlan

bpf:
  masquerade: true

devices:
  - eth+
  - ens+

loadBalancer:
  mode: snat
  algorithm: maglev
  acceleration: best-effort

gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
    nodeLabelSelector:
      matchLabels:
        node-role.kubernetes.io/control-plane: "true"

envoy:
  securityContext:
    capabilities:
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
      keepCapNetBindService: true

operator:
  replicas: 1
  dashboards:
    enabled: false

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

dashboards:
  enabled: false
