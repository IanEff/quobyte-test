# Layered onto the running Cilium release by install_observability.sh
# (`helm upgrade --reuse-values -f`), so the VM bootstrap's install_cilium.sh
# stays minimal and a rebuild picks this up from `task up`.
prometheus:
  enabled: true            # agent metrics on :9962, pod-annotated for scraping

operator:
  prometheus:
    enabled: true

hubble:
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - flows-to-world
      # Per-workload RED metrics for anything a CNP sends through the L7
      # proxy: S3 on 8484, the API/MCP on 7860, the webconsole on 8080.
      - "httpV2:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction"
    # Hubble/Cilium dashboards as grafana_dashboard ConfigMaps, which the
    # Grafana sidecar in `monitoring` picks up.
    dashboards:
      enabled: true
      namespace: monitoring

dashboards:
  enabled: true
  namespace: monitoring
